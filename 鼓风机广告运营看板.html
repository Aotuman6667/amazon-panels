  sub.forEach(function(x){

  });
  var out = Object.keys(by).map(function(k){

    h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+it.c+'" stroke-width="20" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')"><title>'+esc(it.n)+' '+pc(it.v/tot*100,1)+'</title></circle>';
    off+=len;
  });
  h+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">'+pc(items[0].v/tot*100,0)+'</text>';
  h+='<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="10" fill="#94a3b8">'+esc(items[0].n)+'</text>';
  return h+'</svg>';
}

/* ---------- 通用渲染块 ---------- */
function kpiRow(list){
  return '<div class="kpis">'+list.map(function(k){
    return '<div class="kpi '+(k.cls||'')+'"><div class="l">'+k.l+'</div><div class="v" style="'+(k.color?'color:'+k.color:'')+'">'+k.v+'</div><div class="d">'+(k.d||'')+'</div></div>';
  }).join('')+'</div>';
}
function structTable(rows,labelCol,opts){
  opts=opts||{};
  var max=Math.max.apply(null,rows.map(function(r){return r.spends}).concat([1]));
  var countLabel=opts.countLabel||'活动数';
  var h='<table><thead><tr><th class="ns">'+labelCol+'</th><th class="ns num">'+countLabel+'</th><th class="ns num">花费</th><th class="ns num">占比</th><th class="ns num">销售额</th><th class="ns num">订单</th><th class="ns num">ACoS</th><th class="ns num">ROAS</th><th class="ns num">CPC</th><th class="ns num">CVR</th></tr></thead><tbody>';
  var tot=rows.reduce(function(a,b){return a+b.spends},0)||1;
  rows.forEach(function(r){
    var name=r.name||r.nm;
    h+='<tr><td>'+esc(name)+'</td><td class="num">'+(r.campaigns!=null?r.campaigns:'—')+'</td><td class="num">'+usd(r.spends)+
      '</td><td class="num"><span class="wrapbar">'+bar(r.spends,max)+'<span class="mut sm">'+pc(r.spends/tot*100,1)+'</span></span></td>'+
      '<td class="num">'+usd(r.sales)+'</td><td class="num"'+(r.orders?' style="font-weight:700"':'')+'>'+(r.orders!=null?r.orders:'—')+'</td><td class="num">'+acosTag(r.acos)+'</td><td class="num">'+(r.roas?r.roas.toFixed(2):'—')+
      '</td><td class="num">'+(r.cpc?usd(r.cpc):'—')+'</td><td class="num">'+(r.cvr!=null?pc(r.cvr,1):'—')+'</td></tr>';
  });
  return h+'</tbody></table>';
}

/* ---------- 关键词 ---------- */
function kwAdvice(r){
  if(r.o===0&&r.sp>=8)return ['否词/降价','tr'];
  if(r.ac!=null&&r.ac>=30&&r.sp>=10)return ['降竞价','tr'];
  if(r.ac!=null&&r.ac>=25&&r.sp>=10)return ['降竞价/缩匹配','ty'];
  if(r.ac!=null&&r.ac<=8&&r.o>=3)return ['拓词/加价','tg'];
  if(r.ac!=null&&r.ac<=12&&r.o>=1)return ['保持+微加','tg'];
  return ['观察','tn'];
}
function renderKw(){
  var el=document.getElementById('p-kw');
  var all=D.keywords.filter(function(r){return gMatch(r.g)}), q=S.q.trim().toLowerCase();
  var mode=S.kwMode||'all';
  var rows=all.filter(function(r){
    if(q&&r.k.indexOf(q)<0)return false;
    if(mode==='zero')return r.o===0&&r.sp>=5;
    if(mode==='high')return (r.ac!=null&&r.ac>=25&&r.sp>=5);
    if(mode==='good')return (r.ac!=null&&r.ac<=10&&r.o>=2);
    if(mode==='stop')return !r.on;

function stAdvice(r){
  if(r.o===0&&r.sp>=8)return ['精准否定','tr'];
  if(r.ac!=null&&r.ac>=25&&r.sp>=8)return ['否定/降价','tr'];
  if(r.ac!=null&&r.ac<=8&&r.o>=3)return ['提词/加价','tg'];
  if(r.ac!=null&&r.ac<=12&&r.o>=2)return ['可拓词','tg'];
  return ['观察','tn'];
}

}

/* ---------- 导出 ---------- */
function exportCsv(){
  var name='', head=[], rows=[];
  if(S.tab==='camp'){
    name='活动排行'; head=['活动名','组合','类型','竞价','状态','日预算','花费','销售额','订单','ACoS%','CPC','CTR%','CVR%'];
    rows=sortRows(filteredCamps(),(S.sort.camp||{}).k||'sp',(S.sort.camp||{}).dir||'desc').map(function(c){
      return [c.n,c.pf,c.t,c.b,c.st,c.bg,c.sp,c.sa,c.o,c.ac,c.cp,c.ct,c.cv]});
  }else if(S.tab==='asin'){
    name='ASIN'; head=['ASIN','SKU','定义','捆绑','OE号','价格','广告花费','广告销售额','广告单','自然单','总销量','ACoS%','CVR%','FBA可售','在途','库销比'];
    rows=D.asins.map(function(a){return [a.a,a.sku,a.kind,a.bundle,a.oe,a.price,a.adsp,a.adsa,a.ad,a.org,a.v,a.ac,a.cv,a.stk,a.inb,a.rat]});
  }else if(S.tab==='kw'){
    name='关键词'; head=['关键词','匹配','词数','均价','花费','销售额','订单','ACoS%','CVR%','CTR%','CPC'];
    rows=D.keywords.map(function(k){return [k.k,k.mt,k.n,k.bid,k.sp,k.sa,k.o,k.ac,k.cv,k.ct,k.cp]});
  }else if(S.tab==='st'){
    name='搜索词'; head=['搜索词','来源','花费','销售额','订单','ACoS%','CVR%','CPC','CTR%'];
    rows=D.sterms.map(function(s){return [s.q,s.ob,s.sp,s.sa,s.o,s.ac,s.cv,s.cp,s.ct]});
  }else{
    name='广告组合'; head=['组合','活动数','花费','销售额','订单','ACoS%','ROAS','CPC','CVR%'];
    rows=D.portfolios.map(function(p){return [p.name,p.campaigns,p.spends,p.sales,p.orders,p.acos,p.roas,p.cpc,p.cvr]});
  }
  var csv='\uFEFF'+[head.join(',')].concat(rows.map(function(r){return r.map(function(x){
    var s=x==null?'':String(x); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')})).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='鼓风机'+name+'_'+D.meta.window.replace(/ /g,'')+'.csv'; a.click();
}

/* ---------- 框架 ---------- */
function renderAll(){
  var t=S.tab;
  if(t==='ov')renderOverview();
  else if(t==='camp')renderCamp();
  else if(t==='asin')renderAsin();
  else if(t==='kw')renderKw();
  else if(t==='st')renderSt();
  else if(t==='plc')renderPlc();
  else if(t==='alert')renderAlert();
  else if(t==='day')renderDay();
  else renderDocs();
}
function buildSelPf(){
  var sel=document.getElementById('selPf');
  sel.innerHTML='<option value="">选择具体组合…</option>'+D.portfolios.map(function(p){
    return '<option value="'+esc(p.name)+'">'+esc(p.name)+'（'+usd(p.spends)+'）</option>'}).join('');
  sel.onchange=function(){
    if(this.value){S.pf=this.value;document.querySelectorAll('#segPf button').forEach(function(b){b.classList.remove('on')})}
    else {S.pf='全部';document.querySelector('#segPf button[data-pf="全部"]').classList.add('on')}
    renderAll();
  };
}
function updateHeader(){
  var m=D.meta, R=DATA.meta.ranges;
  document.getElementById('subline').innerHTML=
    'US23 · 配件事业部 <span class="dot">|</span> 当前窗口 <b>'+(S.win==='7d'?((DATA.meta.ranges.week7||'本周')+' · 7天'):'30天')+'（'+m.window+'）</b>'+
    '<span class="dot">|</span> 活动 '+n0(D.kpi['cur'].campaigns)+' 个 · 关键词 '+n0(D.kw_total)+' · 搜索词 '+n0(D.sterms.length)+
    '<span class="dot">|</span> 更新于 '+m.updated+'<span class="dot">|</span> 数据源：领星广告中心 + 商品表现 + FBA库存';
  document.getElementById('w30lab').textContent=R['30d'].replace(/ /g,'');
  document.getElementById('w7lab').textContent=(R.week7||'本周')+' '+R['7d'].replace(/ /g,'');
}
function switchWin(w){
  if(S.win===w)return;
  S.win=w; D=DATA.wins[w]; S.sort={}; S.showAll={}; S.pf='全部'; S.q='';
  var q=document.getElementById('q'); if(q)q.value='';
  document.querySelectorAll('#segPf button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-pf')==='全部')});
  document.querySelectorAll('#winswitch button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-w')===w)});
  buildSelPf(); updateHeader(); renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}
function boot(){
  document.querySelectorAll('#winswitch button').forEach(function(b){
    b.onclick=function(){switchWin(b.getAttribute('data-w'))};
  });
  document.querySelectorAll('#segPf button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('#segPf button').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on'); S.pf=b.getAttribute('data-pf');
      var sel=document.getElementById('selPf'); if(sel)sel.value='';
      renderAll();
    };
  });
  document.querySelectorAll('#tabs .tab').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('#tabs .tab').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('on')});
      S.tab=b.getAttribute('data-t');
      document.getElementById('p-'+S.tab).classList.add('on');
      renderAll(); window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){document.querySelector('#tabs .tab[data-t="'+b.getAttribute('data-go')+'"]').click()}});
  document.getElementById('btnCsv').onclick=exportCsv;
  var q=document.getElementById('q');
  var tm=null; q.oninput=function(){clearTimeout(tm);tm=setTimeout(function(){S.q=q.value;renderAll()},220)};
  buildSelPf(); updateHeader(); renderAll();
}
boot();
</script>
