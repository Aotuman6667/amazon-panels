/* ---------- 基础工具 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function n0(x){return (x==null||isNaN(x))?'—':Math.round(x).toLocaleString('en-US')}
function n2(x){return (x==null||isNaN(x))?'—':Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function usd(x){return (x==null||isNaN(x))?'—':'$'+n2(x)}
function usd0(x){return (x==null||isNaN(x))?'—':'$'+n0(x)}
function pc(x,d){return (x==null||isNaN(x))?'—':Number(x).toFixed(d==null?2:d)+'%'}
function acosCls(a){if(a==null)return 'tn';if(a<=15)return 'tg';if(a<=20)return 'ty';return 'tr'}
function acosTag(a){return '<span class="tag '+acosCls(a)+'">'+pc(a)+'</span>'}
function delta(cur,base,rev){
  if(!base)return '<span class="flat">—</span>';
  var c=(cur-base)/base*100; if(rev)c=-c;
  var cls=c>0.05?'up':(c<-0.05?'down':'flat');
  return '<span class="'+cls+'">'+(c>0?'▲':'▼')+' '+Math.abs(c).toFixed(1)+'%</span>';
}
function pfMatch(name){
  if(S.pf==='全部')return true;
  if(S.pf==='新品'||S.pf==='老品')return groupOf(name)===S.pf;
  return name===S.pf;
}
function groupOf(n){
  if(!n||n==='（无组合）')return '无组合';
  if(n.indexOf('叶巧敏')>=0)return '叶敏组';
  if(n.indexOf('新品')>=0)return '新品';
  return '老品';
}
function kpiOf(rows){
  var sp=0,sa=0,o=0,cl=0,im=0,u=0;
  rows.forEach(function(r){sp+=r.sp;sa+=r.sa;o+=r.o;cl+=r.cl;im+=r.im;u+=r.u||0});
  return {sp:sp,sa:sa,o:o,cl:cl,im:im,u:u,
    ac:sa?sp/sa*100:null, roas:sp?sa/sp:null, cpc:cl?sp/cl:null,
    ctr:im?cl/im*100:null, cvr:cl?o/cl*100:null};
}
function filteredCamps(){
  var q=S.q.trim().toLowerCase();
  return D.campaigns.filter(function(c){
    if(!pfMatch(c.pf))return false;
    if(q&&(c.n.toLowerCase().indexOf(q)<0&&String(c.id).indexOf(q)<0))return false;
    return true;
  });
}
function bar(v,max,w){
  w=w||70; var p=max?Math.max(1,Math.round(v/max*w)):0;
  return '<span class="bar" style="width:'+p+'px"></span>';
}
function gTag(g, mix){
  var v = g || '未归属';
  var c = v === '新品' ? 'ti' : (v === '老品' ? 'tn' : '');
  return '<span class="tag '+c+'">'+esc(v)+'</span>' + (mix ? '<span class="sm" title="跨组合: '+esc(mix)+'">*</span>' : '');
}
function tableHTML(cols,rows,cfg){
  var h='<table><thead><tr>';
  cols.forEach(function(c){
    var sk=cfg&&cfg.sortKey===c.k, dir=cfg&&cfg.dir==='asc'?'▲':'▼';
    h+='<th class="'+(c.num?'num ':'')+(c.ns?'ns':'')+'" data-k="'+(c.k||'')+'">'+c.t+
       (c.k&&!c.ns?'<span class="ar">'+(sk?dir:'↕')+'</span>':'')+'</th>';
  });
  h+='</tr></thead><tbody>';
  if(!rows.length)h+='<tr><td colspan="'+cols.length+'" class="emptytip">没有符合条件的数据</td></tr>';
  rows.forEach(function(r,i){
    h+='<tr>';
    cols.forEach(function(c){
      var v=c.f?c.f(r,c,i):r[c.k];
      h+='<td class="'+(c.num?'num ':'')+(c.cls||'')+'">'+v+'</td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
function sortRows(rows,key,dir){
  if(!key)return rows;
  var s=rows.slice();
  s.sort(function(a,b){
    var x=a[key],y=b[key];
    if(typeof x==='string'||typeof y==='string')return (String(x)||'').localeCompare(String(y)||'')*(dir==='asc'?1:-1);
    x=x==null?-1e9:x; y=y==null?-1e9:y;
    return (x-y)*(dir==='asc'?1:-1);
  });
  return s;
}
function bindSort(el,key,def){
  el.querySelectorAll('thead th[data-k]').forEach(function(th){
    th.onclick=function(){
      var k=th.getAttribute('data-k'); if(!k)return;
      var cur=S.sort[key]||def||{};
      var dir=(cur.k===k&&cur.dir==='desc')?'asc':'desc';
      S.sort[key]={k:k,dir:dir}; renderAll();
    };
  });
}

/* ---------- 图表 ---------- */
function lineChart(series,opt){
  opt=opt||{};
  var W=opt.w||980,H=opt.h||240,pad={l:52,r:52,t:16,b:26};
  var labels=opt.labels, n=labels.length;
  var left=series.filter(function(s){return s.axis!=='right'}), right=series.filter(function(s){return s.axis==='right'});
  var vals=[]; left.forEach(function(s){s.data.forEach(function(v){if(v!=null)vals.push(v)})});
  function nice(v){if(v<=0)return 1;var e=Math.pow(10,Math.floor(Math.log10(v))),m=v/e;var k=m<=1?1:(m<=2?2:(m<=2.5?2.5:(m<=5?5:10)));return k*e}
  var max=nice(Math.max.apply(null,vals.concat([1]))*1.08), min=0;
  var rvals=[]; right.forEach(function(s){s.data.forEach(function(v){if(v!=null)rvals.push(v)})});
  var maxR=nice(Math.max.apply(null,rvals.concat([1]))*1.15), minR=0;
  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  function X(i){return pad.l+(n<=1?0:iw*i/(n-1))}
  function Y(v){return pad.t+ih-(v-min)/(max-min)*ih}
  function YR(v){return pad.t+ih-(v-minR)/(maxR-minR)*ih}
  var h='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" preserveAspectRatio="none" style="overflow:visible">';
  for(var g=0;g<=4;g++){
    var y=pad.t+ih*g/4, val=max-(max-min)*g/4;
    h+='<line x1="'+pad.l+'" y1="'+y+'" x2="'+(W-pad.r)+'" y2="'+y+'" stroke="#eef2f7"/>';
    h+='<text x="'+(pad.l-7)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="#94a3b8">'+(opt.axisFmt?opt.axisFmt(val):Math.round(val))+'</text>';
    if(right.length){
      var rv=maxR-(maxR-minR)*g/4;
      h+='<text x="'+(W-pad.r+7)+'" y="'+(y+3.5)+'" text-anchor="start" font-size="10" fill="#f59e0b">'+(opt.axisFmtR?opt.axisFmtR(rv):Math.round(rv))+'</text>';
    }
  }
  labels.forEach(function(l,i){
    if(n>14&&i%Math.ceil(n/10)!==0&&i!==n-1)return;
    h+='<text x="'+X(i)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9.5" fill="#94a3b8">'+l+'</text>';
  });
  series.forEach(function(s){
    var YY=s.axis==='right'?YR:Y;
    var d='',area='';
    s.data.forEach(function(v,i){if(v==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+YY(v).toFixed(1)+' '});
    if(s.fill){
      area=d+'L'+X(n-1).toFixed(1)+' '+(pad.t+ih)+' L'+X(0).toFixed(1)+' '+(pad.t+ih)+' Z';
      h+='<path d="'+area+'" fill="'+s.color+'" opacity=".10"/>';
    }
    h+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||2)+'" '+(s.dash?'stroke-dasharray="4 3"':'')+' stroke-linejoin="round"/>';
    if(s.dots!==false)s.data.forEach(function(v,i){
      if(v==null)return;
      h+='<circle cx="'+X(i)+'" cy="'+YY(v)+'" r="2.6" fill="#fff" stroke="'+s.color+'" stroke-width="1.6"><title>'+(labels[i]+' · '+s.name+' '+(opt.fmt?opt.fmt(v):n2(v)))+'</title></circle>';
    });
  });
  return h+'</svg>';
}
function donut(items,size){
  size=size||150; var r=size/2-12, cx=size/2, cy=size/2, C=2*Math.PI*r;
  var tot=items.reduce(function(a,b){return a+b.v},0)||1, off=0, h='<svg width="'+size+'" height="'+size+'">';
  items.forEach(function(it){
    var len=it.v/tot*C;
    h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+it.c+'" stroke-width="20" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+cx+' '+cy+')"><title>'+esc(it.n)+' '+pc(it.v/tot*100,1)+'</title></circle>';
    off+=len;
  });
  h+='<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">'+pc(items[0].v/tot*100,0)+'</text>';
  h+='<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="10" fill="#94a3b8">'+esc(items[0].n)+'</text>';
  return h+'</svg>';
}

function structTable(rows,labelCol,opts){
  opts=opts||{};

  var countLabel=opts.countLabel||'活动数';
  var h='<table><thead><tr><th class="ns">'+labelCol+'</th><th class="ns num">'+countLabel+'</th><th class="ns num">花费</th><th class="ns num">占比</th><th class="ns num">销售额</th><th class="ns num">ACoS</th><th class="ns num">ROAS</th><th class="ns num">CPC</th><th class="ns num">CVR</th></tr></thead><tbody>';
  var tot=rows.reduce(function(a,b){return a+b.spends},0)||1;

    h+='<tr><td>'+esc(name)+'</td><td class="num">'+(r.campaigns!=null?r.campaigns:'—')+'</td><td class="num">'+usd(r.spends)+

/* ---------- 导出 ---------- */
function exportCsv(){
  var name='', head=[], rows=[];
  if(S.tab==='camp'){
    name='活动排行'; head=['活动名','组合','类型','竞价','状态','日预算','花费','销售额','订单','ACoS%','CPC','CTR%','CVR%'];
    rows=sortRows(filteredCamps(),(S.sort.camp||{}).k||'sp',(S.sort.camp||{}).dir||'desc').map(function(c){
      return [c.n,c.pf,c.t,c.b,c.st,c.bg,c.sp,c.sa,c.o,c.ac,c.cp,c.ct,c.cv]});
  }else if(S.tab==='asin'){
    name='ASIN'; head=['ASIN','SKU','定义','捆绑','OE号','价格','广告花费','广告销售额','广告单','自然单','总销量','ACoS%','CVR%','FBA可售','在途','库销比'];
    rows=D.asins.map(function(a){return [a.a,a.sku,a.kind,a.bundle,a.oe,a.price,a.adsp,a.adsa,a.ad,a.org,a.v,a.ac,a.cv,a.stk,a.inb,a.rat]});
  }else if(S.tab==='kw'){
    name='关键词'; head=['关键词','匹配','词数','均价','花费','销售额','订单','ACoS%','CVR%','CTR%','CPC'];
    rows=D.keywords.map(function(k){return [k.k,k.mt,k.n,k.bid,k.sp,k.sa,k.o,k.ac,k.cv,k.ct,k.cp]});
  }else if(S.tab==='st'){
    name='搜索词'; head=['搜索词','来源','花费','销售额','订单','ACoS%','CVR%','CPC','CTR%'];
    rows=D.sterms.map(function(s){return [s.q,s.ob,s.sp,s.sa,s.o,s.ac,s.cv,s.cp,s.ct]});
  }else{
    name='广告组合'; head=['组合','活动数','花费','销售额','订单','ACoS%','ROAS','CPC','CVR%'];
    rows=D.portfolios.map(function(p){return [p.name,p.campaigns,p.spends,p.sales,p.orders,p.acos,p.roas,p.cpc,p.cvr]});
  }
  var csv='\uFEFF'+[head.join(',')].concat(rows.map(function(r){return r.map(function(x){
    var s=x==null?'':String(x); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')})).join('\n');
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='鼓风机'+name+'_'+D.meta.window.replace(/ /g,'')+'.csv'; a.click();
}

  document.getElementById('w7lab').textContent='W45 '+R['7d'].replace(/ /g,'');
}
function switchWin(w){
  if(S.win===w)return;
  S.win=w; D=DATA.wins[w]; S.sort={}; S.showAll={}; S.pf='全部'; S.q='';
  var q=document.getElementById('q'); if(q)q.value='';
  document.querySelectorAll('#segPf button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-pf')==='全部')});
  document.querySelectorAll('#winswitch button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-w')===w)});
  buildSelPf(); updateHeader(); renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}
function boot(){
  document.querySelectorAll('#winswitch button').forEach(function(b){
    b.onclick=function(){switchWin(b.getAttribute('data-w'))};
  });
  document.querySelectorAll('#segPf button').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('#segPf button').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on'); S.pf=b.getAttribute('data-pf');
      var sel=document.getElementById('selPf'); if(sel)sel.value='';
      renderAll();
    };
  });
  document.querySelectorAll('#tabs .tab').forEach(function(b){
    b.onclick=function(){
      document.querySelectorAll('#tabs .tab').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('on')});
      S.tab=b.getAttribute('data-t');
      document.getElementById('p-'+S.tab).classList.add('on');
      renderAll(); window.scrollTo({top:0,behavior:'smooth'});
    };
  });
  document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){document.querySelector('#tabs .tab[data-t="'+b.getAttribute('data-go')+'"]').click()}});
  document.getElementById('btnCsv').onclick=exportCsv;
  var q=document.getElementById('q');
  var tm=null; q.oninput=function(){clearTimeout(tm);tm=setTimeout(function(){S.q=q.value;renderAll()},220)};
  buildSelPf(); updateHeader(); renderAll();
}
boot();
</script>
</body></html>
